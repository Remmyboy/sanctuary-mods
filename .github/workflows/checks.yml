# What can be checked without the game. The mods themselves can't build here:
# they compile against the game's own DLLs, which can't be published.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same compile the game's LuaJIT does (tools/lua-check.ps1 locally),
      # over every .lua file and every Lua chunk held in a C# string.
      - name: Install LuaJIT
        run: sudo apt-get update -q && sudo apt-get install -y -q libluajit-5.1-2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Lua syntax
        run: |
          lib=$(find /usr/lib -name 'libluajit-5.1.so.2*' | head -1)
          dotnet build tools/GameRef/GameRef.csproj -c Release -v quiet --nologo
          dotnet tools/GameRef/bin/Release/net8.0/GameRef.dll lua "$lib" .

      # Every mod.json (examples and the template included: authors copy those)
      # against docs/mod.schema.json.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Manifests
        run: |
          pip install -q jsonschema
          python tools/check-manifests.py
